appId: com.applelauncher.app
productName: AppleLauncher
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
asarUnpack:
  - "**/*.node"
win:
  target: [nsis]
  icon: build/icon.png
  artifactName: AppleLauncher-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AppleLauncher
  uninstallDisplayName: AppleLauncher
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  # Russian-only installer so the installer texts always match
  multiLanguageInstaller: false
  language: "1049"
  # launcher-style artwork, generated by scripts/make-installer-art.py
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp
# Auto-update feed. Replace owner/repo with your GitHub repository and publish releases there.
publish:
  provider: github
  owner: ssearazer
  repo: applelauncher
